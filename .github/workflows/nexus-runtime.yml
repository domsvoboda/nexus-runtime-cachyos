name: Nexus runtime candidate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  auxiliary:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: auxiliary-key
        run: node nexus/ci/auxiliary-cache.mjs plan x86_64
      - uses: actions/cache/restore@v4
        id: auxiliary-cache
        with:
          path: ${{ runner.temp }}/auxiliary.tar.xz
          key: ${{ steps.auxiliary-key.outputs.key }}
      - name: Install compatibility test prerequisites on cache hits and misses
        timeout-minutes: 15
        run: |
          sudo "$(command -v node)" nexus/ci/ubuntu-mirror.mjs
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential binutils gcc-mingw-w64-x86-64
      - name: Install remaining portable auxiliary build tools
        if: steps.auxiliary-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends cmake gcc-multilib gcc-mingw-w64-i686 curl xz-utils
      - run: node --test nexus/runtime-compat/*.test.mjs
      - run: node nexus/build-auxiliary.mjs --work "$RUNNER_TEMP/nexus-auxiliary"
        if: steps.auxiliary-cache.outputs.cache-hit != 'true'
      - name: Archive exact auxiliary source and binaries
        if: steps.auxiliary-cache.outputs.cache-hit != 'true'
        env:
          XZ_OPT: '-T0'
        run: tar --exclude=.git -cJf "$RUNNER_TEMP/auxiliary.tar.xz" -C "$RUNNER_TEMP" nexus-auxiliary
      - name: Restore cached auxiliary components
        if: steps.auxiliary-cache.outputs.cache-hit == 'true'
        run: tar -xJf "$RUNNER_TEMP/auxiliary.tar.xz" -C "$RUNNER_TEMP"
      - name: Verify auxiliary inputs and bytes on cache hits and misses
        run: node nexus/ci/auxiliary-cache.mjs verify x86_64 "$RUNNER_TEMP/nexus-auxiliary"
      - uses: actions/cache/save@v4
        if: steps.auxiliary-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/auxiliary.tar.xz
          key: ${{ steps.auxiliary-key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-auxiliary
          path: ${{ runner.temp }}/auxiliary.tar.xz
          if-no-files-found: error
          retention-days: 7
  runtime:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')
    needs: auxiliary
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NEXUS_CONTAINER_ENGINE: docker
      NEXUS_BUILD_JOBS: '4'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
      PYTHONDONTWRITEBYTECODE: '1'
      XZ_OPT: '-T2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reclaim unused hosted SDKs and require source disk budget
        run: bash nexus/ci/runner-space.sh --prepare
      - name: Initialize only pinned required source modules
        run: |
          node nexus/ci/initialize-source.mjs --initialize
          bash nexus/ci/runner-space.sh --report after-source
      - name: Initialize runner-local cache directories
        run: |
          printf 'CCACHE_DIR=%s/nexus-ccache\nCARGO_HOME=%s/nexus-cargo\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install bounded offline validation prerequisites
        timeout-minutes: 15
        run: |
          sudo "$(command -v node)" nexus/ci/ubuntu-mirror.mjs
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends zstd build-essential cmake ccache gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-i686 rsync file curl xz-utils flex bison autoconf automake libtool libjson-perl wine64-tools pkg-config python3 openssl xvfb xauth libfreetype-dev libgnutls28-dev libvulkan1 mesa-vulkan-drivers libx11-6 libxext6 libgstreamer1.0-dev libgstreamer-plugins-base1.0-0 libva2 libva-drm2 libva-x11-2 libvdpau1
          echo /usr/lib/wine >> "$GITHUB_PATH"
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends libgnutls30t64:i386 libfreetype6:i386 libx11-6:i386 libxext6:i386
      - name: Report source and prerequisite disk usage
        run: bash nexus/ci/runner-space.sh --report after-prerequisites
      - name: Check both native validation library ABIs before SDK compilation
        run: node nexus/ci/validation-dependencies.mjs
      - uses: actions/download-artifact@v4
        with:
          name: nexus-auxiliary
          path: ${{ runner.temp }}
      - name: Extract verified auxiliary input and remove only its redundant archive
        run: |
          tar -xJf "$RUNNER_TEMP/auxiliary.tar.xz" -C "$RUNNER_TEMP"
          rm -- "$RUNNER_TEMP/auxiliary.tar.xz"
      - name: Check exact clean source and build policy
        run: |
          node nexus/check-source.mjs
          node --test nexus/*.test.mjs nexus/tests/*.test.mjs nexus/ci/*.test.mjs nexus/runtime-compat/*.test.mjs
      - id: cache-plan
        run: node nexus/ci/cache-plan.mjs
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ${{ runner.temp }}/nexus-ccache
          key: ${{ steps.cache-plan.outputs.key }}
          restore-keys: ${{ steps.cache-plan.outputs.restore-prefix }}
      - name: Require measured disk headroom before SDK compilation
        run: bash nexus/ci/runner-space.sh --check
      - name: Build coherent pinned SDK runtime
        id: compile
        run: node nexus/build-runtime.mjs "$RUNNER_TEMP/nexus-auxiliary" "$RUNNER_TEMP/nexus-work" "$RUNNER_TEMP/nexus-output"
      - name: Report SDK stage disk usage even after failure
        continue-on-error: true
        if: always() && !cancelled() && steps.compile.outcome != 'skipped'
        run: bash nexus/ci/runner-space.sh --report after-sdk
      - name: Save bounded compiler cache even after a compile failure
        if: always() && !cancelled() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nexus-ccache
          key: ${{ steps.cache-plan.outputs.key }}
      - name: Report actual compiler cache statistics
        if: always() && !cancelled() && steps.compile.outcome != 'skipped'
        run: ccache --show-stats
      - name: Compile fresh synthetic fixtures in the same pinned SDK
        run: node nexus/ci/build-fixtures.mjs "$RUNNER_TEMP/nexus-output" "$RUNNER_TEMP/nexus-fixtures"
      - name: Preserve compiled runtime, fixtures and corresponding source
        id: checkpoint
        run: |
          python3 nexus/ci/runtime-checkpoint.py create "$RUNNER_TEMP/nexus-output" "$RUNNER_TEMP/nexus-fixtures" "$RUNNER_TEMP/nexus-checkpoint"
          echo "name=runtime-checkpoint-nexus-cachyos-x86_64-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.checkpoint.outputs.name }}
          path: ${{ runner.temp }}/nexus-checkpoint/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  validation:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      XZ_OPT: '-T2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Free only unused preinstalled hosted-runner SDKs
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - name: Install bounded offline validation prerequisites
        timeout-minutes: 15
        run: |
          sudo "$(command -v node)" nexus/ci/ubuntu-mirror.mjs
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends zstd build-essential cmake ccache gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 gcc-mingw-w64-i686 g++-mingw-w64-i686 rsync file curl xz-utils flex bison autoconf automake libtool libjson-perl wine64-tools pkg-config python3 openssl xvfb xauth libfreetype-dev libgnutls28-dev libvulkan1 mesa-vulkan-drivers libx11-6 libxext6 libgstreamer1.0-dev libgstreamer-plugins-base1.0-0 libva2 libva-drm2 libva-x11-2 libvdpau1
          echo /usr/lib/wine >> "$GITHUB_PATH"
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends libgnutls30t64:i386 libfreetype6:i386 libx11-6:i386 libxext6:i386
      - name: Check both native validation library ABIs before SDK compilation
        run: node nexus/ci/validation-dependencies.mjs
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.runtime.outputs.checkpoint }}
          path: ${{ runner.temp }}/nexus-checkpoint
      - name: Restore exact unvalidated build without recompilation
        run: python3 nexus/ci/runtime-checkpoint.py restore "$RUNNER_TEMP/nexus-checkpoint" x86_64
      - name: Validate both ABIs, authentication, saves, DLC, HTTP, media and graphics
        run: xvfb-run -a node nexus/ci/validate-runtime.mjs "$RUNNER_TEMP/nexus-output" "$RUNNER_TEMP/nexus-fixtures" "$RUNNER_TEMP/nexus-validation"
      - name: Package validated bytes and corresponding source only
        run: node nexus/ci/package-runtime.mjs "$RUNNER_TEMP/nexus-output" "$RUNNER_TEMP/nexus-validation"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-runtime
          overwrite: true
          path: |
            ${{ runner.temp }}/nexus-output/*.tar.xz
            ${{ runner.temp }}/nexus-output/*.sha512sum
            ${{ runner.temp }}/nexus-output/candidate.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic test evidence without prefixes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nexus-validation/*.json
            ${{ runner.temp }}/nexus-validation/*.log
            ${{ runner.temp }}/nexus-validation/win64/nexus-*/*.json
            ${{ runner.temp }}/nexus-validation/win64/nexus-*/*.log
            ${{ runner.temp }}/nexus-validation/win32/nexus-*/*.json
            ${{ runner.temp }}/nexus-validation/win32/nexus-*/*.log
            ${{ runner.temp }}/nexus-validation/wine-contract-*/*.json
            ${{ runner.temp }}/nexus-validation/wine-contract-*/*.log
            ${{ runner.temp }}/nexus-validation/runtime-http2-*/*.json
            ${{ runner.temp }}/nexus-validation/runtime-http2-*/*.log
            ${{ runner.temp }}/nexus-validation/runtime-dxvk-*/*.json
            ${{ runner.temp }}/nexus-validation/runtime-dxvk-*/*.log
            ${{ runner.temp }}/nexus-validation/media/results.json
            ${{ runner.temp }}/nexus-fixtures/fixtures.json
            ${{ runner.temp }}/nexus-output/built.json
          retention-days: 7
